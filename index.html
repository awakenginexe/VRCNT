<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/png" href="/src-ui/views/assets/vrcnt_logo_badge.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script>
            try {
                if (localStorage.getItem("enable_performance_mode") === "true") {
                    document.documentElement.classList.add("performance_mode");
                    document.documentElement.dataset.performanceMode = "true";
                }
            } catch {
                // Local storage may be unavailable in hardened webviews.
            }
        </script>
        <title>VRCNT</title>
    </head>

    <body>
        <div id="root"></div>
        <script type="module" src="./src-ui/views/app/index.jsx"></script>
    </body>
</html>
