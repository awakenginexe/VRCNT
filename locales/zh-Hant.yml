about_page:
    version: "版本 {{version}}"
    title: "面向 VRChat 的新一代翻譯"
    description: "VRCNT 是一款獨立開發的翻譯與語音辨識工具，專為 VRChat 中的即時多語言對話而設計。"
    repositories_title: "專案儲存庫"
    repositories_description: "關注 VRCNT 的開發，或查看協助本專案起步的原始 VRCT 專案。"
    vrcnt_repository: "VRCNT GitHub"
    vrct_repository: "原始 VRCT GitHub"
    lineage_title: "專案沿革"
    lineage_description: "VRCNT 起步於 VRCT，部分程式碼仍以該專案為基礎。此後，介面、工作流程、翻譯管線以及應用程式的大部分內容都已針對 VRCNT 大幅重構。它是一個獨立專案，並非 VRCT 的官方版本。"
    origin_label: "起步於"
    origin_value: "misyaguziya 的 VRCT"
    current_label: "目前專案"
    current_value: "awakenginexe 的 VRCNT"
    independence_title: "獨立軟體"
    independence_description: "VRCNT 與 VRChat Inc. 無關聯，也未獲得其認可。VRChat 及相關內容為各自所有者的商標。"

